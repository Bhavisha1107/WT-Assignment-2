<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Student Documents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container form-card">
        <div class="admin-header">
            <h2>Upload Student Documents</h2>
            <a href="#" class="btn btn-secondary btn-sm">View Details &rarr;</a>
        </div>

        <p style="margin-bottom: 16px; font-size: 15px;"><strong>Student:</strong> Bhavisha S (24CS031)</p>

        <form method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Select profile image or document (PDF, JPG, PNG):</label>
                <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png" required>
                <small style="color:#64748b; font-size:12px; margin-top:5px; display:block;">Max allowed file size: 2 MB</small>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Upload File</button>
        </form>

        <div style="margin-top: 20px; display: flex; justify-content: space-between;">
            <a href="#" class="btn btn-secondary btn-sm">&larr; Back to Student Details</a>
            <a href="#" class="btn btn-secondary btn-sm">Student List</a>
        </div>
    </div>
</body>
</html>
