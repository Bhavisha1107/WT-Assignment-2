<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container form-card">
        <div class="admin-header">
            <h2>Add New Student</h2>
            <a href="#" class="btn btn-secondary btn-sm">&larr; Back to List</a>
        </div>

        <form method="post">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" value="Bhavisha S" required>
            </div>

            <div class="form-group">
                <label for="roll_number">Roll Number *</label>
                <input type="text" id="roll_number" name="roll_number" value="24CS031" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="bhavisha@gmail.com">
            </div>

            <div class="form-group">
                <label for="course">Course *</label>
                <input type="text" id="course" name="course" value="Web Technologies" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Add Student & Proceed to Upload</button>
        </form>
    </div>
</body>
</html>
