<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal - Filled Preview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .custom-file-filled {
            padding: 10px 14px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: var(--radius);
            font-size: 13.5px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-badge">&#127891;</div>
            <h1>Student Registration</h1>
            <p class="subtitle">Fill in your academic and personal details to register</p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" value="Bhavisha S">
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" value="24CS031">
                <span class="error" id="rollError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" value="bhavisha@gmail.com">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course">
                    <option value="CSE" selected>Computer Science Engineering</option>
                </select>
                <span class="error" id="courseError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="Bhavisha@2026">
                <span class="error" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="file">Upload Student Document</label>
                <div class="custom-file-filled">
                    <span class="file-tag">ATTACHED</span>
                    <span>passphoto.jpg (142 KB)</span>
                </div>
                <span class="error" id="fileError"></span>
            </div>

            <button type="submit" id="submitBtn">Register Now</button>

            <div id="successMessage" class="success-box show">
                &#10004; Registration form validated successfully!
            </div>
        </form>
    </div>
</body>
</html>
